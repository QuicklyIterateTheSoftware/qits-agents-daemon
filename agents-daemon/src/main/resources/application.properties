# qits-agents-daemon — the process inside a project's long-running agent container (qits-2519).
# A command-mode app with no web stack and no datasource. Everything it is told arrives as container
# environment (QITS_AGENTS_DAEMON_*, QITS_TOKEN, QITS_DOMAIN), read by DaemonConfig; this file
# carries only the build's own settings.

# Name the compiled artifact `qits-agents-daemon` (not <artifact>-<version>-runner), so the process
# is identifiable in `ps`/`docker top`.
quarkus.package.output-name=qits-agents-daemon
quarkus.package.jar.add-runner-suffix=false

quarkus.log.level=INFO
quarkus.banner.enabled=false
