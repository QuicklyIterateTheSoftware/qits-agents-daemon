# Filtered at build time — see agents-daemon-protocol/pom.xml's <resources> block and AgentImage's
# javadoc. The value is this reactor's ${project.version}, which the release flow stamps with the
# version it is about to tag and push the `qits/agent` image under, so the jar's version and the
# image tag are one string by construction.
#
# Do NOT write a literal here. AgentImage refuses a value that still starts with `$`, which is what
# an unfiltered copy of this file looks like.
version=${project.version}
